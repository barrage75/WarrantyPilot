name: CI

on:
  pull_request:
    branches: [integration, main]
  push:
    branches: [integration]

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --locked
      - run: uv run ruff check app tests ../data/appelia
      - run: uv run ruff format --check app tests
      - run: >-
          MYPYPATH=.:../data uv run mypy --strict --explicit-package-bases
          app/contracts app/core ../data/appelia
      - run: uv run pytest tests ../data/appelia/tests

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
