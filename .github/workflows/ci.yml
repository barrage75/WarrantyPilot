name: CI

on:
  pull_request:
    branches: [integration, main]
  push:
    branches: [integration, main]

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - run: uv sync --locked
      - run: uv run playwright install --with-deps chromium
      - run: uv run ruff check app tests ../data/appelia
      - run: uv run ruff format --check app tests
      - run: >-
          MYPYPATH=.:../data uv run mypy --strict --explicit-package-bases
          app/contracts app/core app/ingestion app/rules app/api ../data/appelia
          app/actions app/followup app/intake app/testing
      - run: uv run pytest tests ../data/appelia/tests -m "not p0"

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build

  repro-dell:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: repro/dell
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy
      - run: uv run playwright install --with-deps chromium
      - run: uv run pytest -v

  p0:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - run: uv sync --project backend --locked
      - run: uv sync --project repro/dell --locked
      - run: uv run --project backend playwright install --with-deps chromium
      - run: make p0
