[project]
name = "warrantypilot"
version = "0.1.0"
description = "L0 foundation for WarrantyPilot"
requires-python = ">=3.12,<3.13"
dependencies = [
    "alembic>=1.14,<2",
    "factur-x>=7.9",
    "fastapi>=0.115,<1",
    "lxml>=6.1.3",
    "mistralai>=3.7.0",
    "pdfplumber>=0.11.10",
    "playwright==1.65.1",
    "pydantic>=2.10,<3",
    "pydantic-settings>=2.7,<3",
    "pypdf>=7.1.0",
    "pyyaml>=6,<7",
    "sqlalchemy>=2.0,<3",
    "sse-starlette>=2.2,<3",
    "uvicorn[standard]>=0.34,<1",
]

[dependency-groups]
dev = [
    "httpx>=0.28,<1",
    "mypy>=1.14,<2",
    "pytest>=8.3,<9",
    "pytest-asyncio>=0.25,<1",
    "reportlab>=5.1.0",
    "ruff>=0.9,<1",
    "types-PyYAML>=6,<7",
]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = [".."]
testpaths = ["tests"]
markers = [
    "live: requires configured external credentials",
    "p0: repeatable end-to-end demo gate",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
files = ["app/contracts", "app/core", "app/ingestion", "app/rules"]
ignore_missing_imports = true
